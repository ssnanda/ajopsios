name: ajopsios
description: "AJ Ops mobile — staff app for NC LLC Agents, sharing core auth/api/storage with ajcoreios."
publish_to: 'none'
version: 1.0.5+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Secure credential storage
  flutter_secure_storage: ^9.2.2

  # Biometric authentication (shared AuthRepository supports it; optional at login)
  local_auth: ^2.3.0

  # Offline cache
  shared_preferences: ^2.3.5

  # Internationalisation & date formatting
  intl: ^0.19.0

  # App version display (reads the actual bundled version, not a hand-maintained constant)
  package_info_plus: ^8.1.2

  # Live Chat alerts (local notifications + app icon badge). Deliberately NOT
  # firebase_messaging/APNs — this app is sideloaded without a paid Apple
  # Developer account, which real push notifications require.
  flutter_local_notifications: ^18.0.1

  # Icons
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2802.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
